name: wawa_kalu
description: "Aplicación educativa infantil Wawa Kalú."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.6.0
  vibration: ^3.1.8
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4+1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.3
  flutter_local_notifications: 20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  growth_standards: 5.4.1
  flutter_svg: ^2.3.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sonidos/
    - assets/sonidos/es/
    - assets/sonidos/en/
    - assets/data/vaccines/
    - assets/data/growth/who/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700

    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/WawaKalu_icono.png"

  adaptive_icon_foreground: "assets/images/WawaKalu_icono.png"
  adaptive_icon_background: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/images/WawaKalu_icono.png"
    icon_size: 256

  web:
    generate: true
    image_path: "assets/images/WawaKalu_icono.png"
    background_color: "#FAF7F2"
    theme_color: "#7B2CBF"