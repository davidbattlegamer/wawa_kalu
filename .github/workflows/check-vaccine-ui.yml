name: Comprobar vacunas y recordatorios

on:
  push:
    paths:
      - '.github/workflows/check-vaccine-ui.yml'
      - 'lib/features/vaccines/pages/vaccines_page.dart'
      - 'lib/features/vaccines/services/vaccine_notification_service.dart'
      - 'test/vaccine_reminder_frequency_test.dart'
      - 'lib/pages/app_texts.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-vaccines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependencias
        run: flutter pub get
      - name: Verificar código de vacunas
        run: flutter analyze --no-pub lib/features/vaccines/pages/vaccines_page.dart lib/features/vaccines/services/vaccine_notification_service.dart test/vaccine_reminder_frequency_test.dart
      - name: Probar frecuencias
        run: flutter test test/vaccine_reminder_frequency_test.dart
