name: Verificar y actualizar compilación Android

on:
  push:
    paths:
      - ".github/workflows/check-android-build.yml"
      - "android/settings.gradle.kts"
      - "android/gradle/wrapper/gradle-wrapper.properties"
      - "android/app/build.gradle.kts"
      - "android/gradle.properties"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wawa-android-build
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Misma rama de Flutter que utiliza el proyecto al compilar en Windows.
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Verificar versiones de herramientas
        run: |
          flutter --version
          java -version

      - name: Obtener dependencias verificadas
        run: flutter pub get

      - name: Compilar APK release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log

      - name: Comprobar ausencia de avisos KGP
        run: |
          if grep -E 'WARNING: Your app uses the following plugins that apply Kotlin Gradle Plugin|Future versions of Flutter will fail' android-build.log; then
            echo 'Se siguen aplicando plugins Kotlin antiguos.'
            exit 1
          fi
          echo 'No se encontraron avisos KGP'

      - name: Publicar diagnóstico del APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawa-android-build-diagnostic
          path: |
            android-build.log
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 3

