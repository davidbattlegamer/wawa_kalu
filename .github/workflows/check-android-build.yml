name: Verificar y actualizar compilación Android

on:
  push:
    paths:
      - ".github/workflows/check-android-build.yml"
      - "android/settings.gradle.kts"
      - "android/gradle/wrapper/gradle-wrapper.properties"
      - "android/app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wawa-android-build
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar versiones de herramientas
        run: |
          flutter --version
          java -version

      - name: Actualizar solamente los plugins con advertencias de Kotlin
        run: |
          flutter pub get
          flutter pub upgrade device_info_plus shared_preferences_android

      - name: Compilar APK release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log

      - name: Publicar diagnóstico del APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wawa-android-build-diagnostic
          path: |
            android-build.log
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Guardar dependencias comprobadas en main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(android): fijar versiones verificadas de plugins Kotlin"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "El lockfile ya estaba actualizado"
          fi
